<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentiaGuard — Guardián de Bienestar Emocional</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="chat-header-content">
                <div class="header-text">
                    <div class="logo-area">
                        <span class="status-dot"></span>
                        <h1>SentiaGuard <span class="ai-badge">AI</span></h1>
                    </div>
                    <p>Monitor proactivo de bienestar emocional</p>
                </div>
                <div class="header-controls">
                    <div class="accessibility-controls">
                        <button id="accessibilityBtn" class="btn access-btn" title="Opciones de accesibilidad">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.5"/><path d="M12 7.5V20M8 9h8M10 20l-2-5M14 20l2-5"/></svg>
                            Accesibilidad
                        </button>
                        
                        <div class="accessibility-dropdown" id="accessibilityMenu">
                            <h3>Accesibilidad</h3>
                            <div class="accessibility-menu-item">
                                <label>Contraste / Tema</label>
                                <button id="themeToggleBtn" class="toggle-btn">Activar Tema Claro</button>
                            </div>
                            <div class="accessibility-menu-item">
                                <label>Tamaño de Fuente</label>
                                <div class="font-size-controls">
                                    <button id="fsSmallBtn" class="fs-btn" data-size="small">Chico</button>
                                    <button id="fsNormalBtn" class="fs-btn active" data-size="normal">Normal</button>
                                    <button id="fsLargeBtn" class="fs-btn" data-size="large">Grande</button>
                                    <button id="fsXlargeBtn" class="fs-btn" data-size="xlarge">Muy Grande</button>
                                </div>
                            </div>
                            <div class="accessibility-menu-item">
                                <label>Lectura Facilitada</label>
                                <button id="dyslexiaToggleBtn" class="toggle-btn">Fuente Dislexia</button>
                            </div>
                        </div>
                    </div>

                    <button id="clearHistoryBtn" class="btn clear-btn" title="Limpiar conversación">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Limpiar
                    </button>
                </div>
            </div>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="message welcome-message">
                <strong>Hola. Este es un espacio seguro.</strong>
                <p>Escribe lo que sientes o piensas. Nuestra IA analizará tu estado emocional de forma privada para brindarte el mejor apoyo posible.</p>
            </div>
        </main>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="radial-pulse-loader" id="radialLoader" style="display: none;">
                <canvas id="pulseCanvas"></canvas>
            </div>
            <span class="typing-text">Pensando...</span>
        </div>

        <footer class="chat-input-wrapper">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Escribe aquí tu mensaje..." autocomplete="off">
                <button id="sendButton" class="send-btn" title="Enviar">
                    <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
